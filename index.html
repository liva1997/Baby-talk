
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Talk</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(160deg,#fff0f5,#e7f2ff);
  color: #70465a;
  text-align: center;
}

main {
  max-width: 460px;
  margin: auto;
  padding: 22px 18px;
}

h1 {
  color: #d94f86;
  font-size: 32px;
}

.photo {
  width: 85%;
  max-width: 340px;
  aspect-ratio: 3/4;
  object-fit: cover;
  border-radius: 26px;
  box-shadow: 0 12px 35px #9e668433;
}

.photo.talking {
  animation: talk .22s infinite alternate;
}

@keyframes talk {
  to { transform: scale(1.02); }
}

.bubble {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin: 20px auto;
  min-height: 55px;
}

textarea {
  width: 100%;
  min-height: 90px;
  border: 2px solid #f0b6ce;
  border-radius: 16px;
  padding: 14px;
  font-size: 17px;
  font-family: Arial;
  resize: vertical;
}

button {
  border: 0;
  border-radius: 30px;
  padding: 16px 22px;
  font-size: 16px;
  margin: 7px;
}

#start {
  background: #e85d91;
  color: white;
}

#stop {
  background: white;
  color: #87566d;
}
</style>
</head>

<body>
<main>

<h1>🎀 Baby Talk 🎀</h1>
<p>Ti flet, bebja të përsërit! ❤️</p>

<img
  class="photo"
  id="baby"
  src="Baby.jpeg.PNG"
  alt="Bebja ime"
>

<div class="bubble" id="words">
Përshëndetje! Fol me mua ❤️
</div>

<p>Shkruaj ose dikto fjalët këtu:</p>

<textarea id="message"
placeholder="Prek mikrofonin e tastierës dhe fol..."></textarea>

<br>

<button id="start">
❤️ BEBJA FLET
</button>

<button id="stop">
⏹ NDALO
</button>

<p id="status">Bebja është gati! ❤️</p>

</main>

<script>
const baby = document.getElementById("baby");
const words = document.getElementById("words");
const status = document.getElementById("status");
const message = document.getElementById("message");

function say(text) {
  text = text.trim();

  if (!text) {
    status.textContent = "Shkruaj diçka për beben! ❤️";
    return;
  }

  speechSynthesis.cancel();

  words.textContent = "Ti the: " + text;
  status.textContent = "❤️ Bebja po të përsërit!";

  baby.classList.add("talking");

  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = "sq-AL";
  voice.pitch = 1.6;
  voice.rate = 0.85;

  voice.onend = () => {
    baby.classList.remove("talking");
    status.textContent = "Bebja është gati përsëri! ❤️";
  };

  voice.onerror = () => {
    baby.classList.remove("talking");
    status.textContent = "Provo përsëri!";
  };

  speechSynthesis.speak(voice);
}

document.getElementById("start").onclick = () => {
  say(message.value);
};

document.getElementById("stop").onclick = () => {
  speechSynthesis.cancel();
  baby.classList.remove("talking");
  status.textContent = "Bebja pushoi ❤️";
};
</script>

</body>
</html>
